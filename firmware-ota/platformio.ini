[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions/partitions_ota.csv
monitor_speed = 115200
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.68.150
build_flags =
    -Wno-cpp
    -DAUDIO_FORMAT_OPUS
    -I.pio/libdeps/xiao_esp32s3/esp-sr/include/esp32s3
    -I.pio/libdeps/xiao_esp32s3/esp-sr/src/include
    -L.pio/libdeps/xiao_esp32s3/esp-sr/lib/esp32s3
    -Wl,--unresolved-symbols=ignore-all
    -lesp_audio_front_end
    -lesp_audio_processor
    -ldl_lib
    -lvadnet
    -lnsnet
    -lc_speech_features
    -lfst
    -lhufzip
    -lmultinet
    -lwakenet
lib_deps =
    tzapu/WiFiManager@^2.0.17
    ; RemoteDebug removed — using Serial logging with compile-time levels
    sh123/esp32_opus@^1.0.3
    https://github.com/pschatzmann/codec-ogg.git
    https://github.com/espressif/esp-sr.git#4f1b5607de050045e5662157ba694a4708af9533

[env:test]
platform = native
framework =
build_flags = -std=c++17
lib_deps =
    throwtheswitch/Unity@^2.5.2
test_framework = unity
