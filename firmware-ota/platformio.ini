[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions/partitions_ota.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -Wno-cpp
    -DAUDIO_FORMAT_WAV
lib_deps =
    tzapu/WiFiManager@^2.0.17
    ; RemoteDebug removed — using Serial logging with compile-time levels
    sh123/esp32_opus@^1.0.3
    https://github.com/pschatzmann/codec-ogg.git

[env:test]
platform = native
framework =
build_flags = -std=c++17
build_src_filter = +<test/test_all.cpp>
lib_deps =
    throwtheswitch/Unity@^2.5.2
test_framework = unity
