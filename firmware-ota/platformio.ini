[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions/partitions_ota.csv
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
upload_port = /dev/ttyACM1
build_flags =
    -Wno-cpp
    -Ilib
    -DCONFIG_ESP_PANIC_ACTION_PRINT_AND_HALT=y
    -DAUDIO_FORMAT_OPUS
    -DSLOW_BOOT
    -DCONFIG_SPIRAM_MODE_OCT=y
    -DCONFIG_SPIRAM_SPEED_80M=y
    -DCONFIG_SPIRAM_BOOT_INIT=y
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    -I.pio/libdeps/xiao_esp32s3/esp-sr/include/esp32s3
    -I.pio/libdeps/xiao_esp32s3/esp-sr/src/include
    -I.pio/libdeps/xiao_esp32s3/WiFiClientSecure/src
    -L.pio/libdeps/xiao_esp32s3/esp-sr/lib/esp32s3
    -Wl,--unresolved-symbols=ignore-all
    -lesp_audio_front_end
    -lesp_audio_processor
    -ldl_lib
    -lvadnet
    -lnsnet
    -lc_speech_features
    -lfst
    -lhufzip
    -lmultinet
    -lwakenet
lib_deps =
    shaxzod/RisalDash@^0.13.0
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson@^7.0.0
    sh123/esp32_opus@^1.0.3
    https://github.com/pschatzmann/codec-ogg.git
    https://github.com/espressif/esp-sr.git#4f1b5607de050045e5662157ba694a4708af9533
    WiFiClientSecure

[env:test]
platform = native
framework =
build_flags = -std=c++17 -Ilib -DOAUTH2_TESTING
lib_deps =
    throwtheswitch/Unity@^2.5.2
    bblanchon/ArduinoJson@^7.0.0
test_framework = unity
