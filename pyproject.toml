[project]
name = "lifelog-e2e"
version = "0.1.0"
description = "End-to-end integration tests for LifeLog"
requires-python = ">=3.11"
dependencies = [
    "piper-tts>=1.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydub>=0.25.1",
    "asyncpg>=0.29.0",
]

[project.scripts]
e2e = "e2e.run_e2e:main"

[tool.hatch.build.targets.wheel]
packages = ["e2e"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
