[project]
name = "device-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydub>=0.25.0",
    "orjson>=3.10.0",
    "requests>=2.32.0",
]
optional-dependencies.dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
download-ami = "device_sim.scripts.download_ami:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "SIM113"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 1800
