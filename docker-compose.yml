version: '3.8'

services:
  # PostgreSQL Database - Encrypted Data Service
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=lifelog
      - POSTGRES_USER=lifelog
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main orchestrator - ONLY service with direct DB access
  server:
    build: ./server
    ports:
      - "8444:8443"
    environment:

      - WHISPER_ASR_URL=${WHISPER_ASR_URL:-http://whisper-asr:9000}
      - SPEAKER_ID_URL=${SPEAKER_ID_URL:-http://speaker-id:8443}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen2.5:7b}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - AUDIO_STORAGE_PATH=/data/audio
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lifelog
      - POSTGRES_USER=lifelog
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - LOG_LEVEL=DEBUG
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audio-data:/data/audio
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      whisper-asr:
        condition: service_healthy
      speaker-id:
        condition: service_started

  # Whisper ASR — transcription + diarization via whisperx
  # Uses v1.9.1-gpu base (v1.10.0 broke whisperx: lightning/pyannote conflict)
  whisper-asr:
    build: ./whisper-asr
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=large-v3
      - ASR_ENGINE=whisperx
      - ASR_DEVICE=cuda
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Speaker identification - No DB access
  speaker-id:
    build: ./speaker-id
    ports:
      - "8445:8443"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      uvicorn speaker_id.main:app
        --host 0.0.0.0
        --port 8443

  # Web dashboard - No DB access
  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres-data:
  audio-data:
