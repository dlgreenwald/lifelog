version: '3.8'

services:
  # PostgreSQL Database - Encrypted Data Service
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=lifelog
      - POSTGRES_USER=lifelog
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main orchestrator - ONLY service with direct DB access
  server:
    build: ./server
    ports:
      - "8444:8443"
    environment:

      - SPEAKER_ID_URL=${SPEAKER_ID_URL:-http://speaker-id:8443}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen2.5:7b}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - AUDIO_STORAGE_PATH=/data/audio
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lifelog
      - POSTGRES_USER=lifelog
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audio-data:/data/audio
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      speaker-id:
        condition: service_started

  # Standalone GPU transcription worker — no database access
  transcription-worker:
    build: ./transcription-worker
    ports:
      - "9001:9000"
    environment:
      - SERVER_URL=${TRANSCRIPTION_SERVER_URL:-http://server:8443}
      - POLL_INTERVAL=${TRANSCRIPTION_WORKER_POLL_INTERVAL:-5}
      - ASR_MODEL=large-v3
      - ASR_DEVICE=cuda
      - MODEL_CACHE_DIR=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - IDLE_UNLOAD_SECONDS=${TRANSCRIPTION_IDLE_UNLOAD_SECONDS:-300}
      - WARM_KEEPALIVE_SECONDS=${TRANSCRIPTION_WARM_KEEPALIVE_SECONDS:-60}
      # When set to >0 the worker exits itself after this many seconds of
      # full idleness. Combined with the ``restart: unless-stopped``
      # policy below, docker-compose will bring it back up so the
      # CTranslate2 + pyannote pinned GPU buffers (which the in-process
      # unload cannot free) are reclaimed on a clean cold start.
      - IDLE_PROCESS_RESTART_SECONDS=${TRANSCRIPTION_IDLE_PROCESS_RESTART_SECONDS:-900}
    volumes:
      - ./whisper-asr/hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Required for the IDLE_PROCESS_RESTART_SECONDS self-exit path:
    # docker-compose must resurrect the worker after it kills itself
    # so the GPU's pinned CTranslate2 / pyannote buffers (which
    # ``unload_models`` cannot free from inside the process) are
    # reclaimed on a clean cold start.
    restart: unless-stopped

  # Speaker identification - No DB access
  speaker-id:
    build: ./speaker-id
    ports:
      - "8445:8443"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      uvicorn speaker_id.main:app
        --host 0.0.0.0
        --port 8443

  # Web dashboard - No DB access
  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    environment:
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
    depends_on:
      - server

volumes:
  postgres-data:
  audio-data:
