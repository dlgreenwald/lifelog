name: "sprint-planning"
description: "Sprint planning with 4 speakers, ~4 minutes"
speakers:
  Alice:
    voice: en_US-lessac-medium
  Bob:
    voice: en_US-ryan-medium
  Carol:
    voice: en_US-amy-medium
  Dave:
    voice: en_US-joe-medium

lines:
  - speaker: Alice
    text: "Welcome to sprint planning. We have ten story points to allocate. Bob, what's the highest priority item?"
    pause_after: 0.4
  - speaker: Bob
    text: "The audio upload reliability fix. We're seeing intermittent failures on slow connections. I'd estimate three story points."
    pause_after: 0.3
  - speaker: Alice
    text: "Agreed. Carol, the speaker labeling UI needs work too. How many points?"
    pause_after: 0.3
  - speaker: Carol
    text: "That's a five pointer. The retroactive re-identification logic is complex. We need to update all historical recordings when a voiceprint changes."
    pause_after: 0.4
  - speaker: Dave
    text: "Can we break that into two stories? Do the UI first, then the re-identification backend."
    pause_after: 0.3
  - speaker: Carol
    text: "Good idea. Three points for the UI, two for the backend re-ID."
    pause_after: 0.3
  - speaker: Alice
    text: "That leaves two points. Dave, any maintenance work?"
    pause_after: 0.3
  - speaker: Dave
    text: "The firmware OTA partition table needs updating. That's a one-pointer. And we should update the documentation."
    pause_after: 0.3
  - speaker: Alice
    text: "Perfect. Ten points total. Let's commit to these priorities and start tomorrow."
    pause_after: 0.2
  - speaker: Bob
    text: "Sounds like a plan. I'll pick up the upload fix first thing."
    pause_after: 0.3
  - speaker: Carol
    text: "I'll start designing the speaker labeling component today so we're ready to code tomorrow."
    pause_after: 0.3
  - speaker: Dave
    text: "I'll handle the firmware partition update and documentation this afternoon."
    pause_after: 0.4
  - speaker: Alice
    text: "Great. Let's reconvene on Wednesday to check progress. Remember to update your tickets."
