[project]
name = "lifelog-transcription-worker"
version = "1.0.0"
description = "Standalone WhisperX transcription worker for LifeLog"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "whisperx>=3.3.0",
    "transformers<5",
    "torch==2.7.1",
    "torchaudio==2.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["audio.py", "pipeline.py", "main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
