[project]
name = "lifelog-transcription-worker"
version = "1.0.0"
description = "Standalone WhisperX transcription worker for LifeLog"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "whisperx>=3.3.0",
    "transformers>=5.5.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "pydantic-settings>=2.1.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]



[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Anti-pattern guards tolerate:
#  * broad excepts inside the safe-load wrapper (pickle.UnpicklingError
#    can wrap unrelated errors; we re-raise selectively based on
#    candidate-path trust).
#  * try-except-continue where import-time configurability is best-effort.
ignore = ["BLE001", "S112"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
