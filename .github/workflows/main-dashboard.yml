name: 'Main: Dashboard'

# Per-component merge contract for the dashboard image.
# Triggers on push to main when files inside dashboard/** or the shared
# merge-infra change. See main-server.yml for the design.

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - '.github/workflows/**'
      - 'AGENTS.md'

permissions:
  packages: write

jobs:
  test:
    uses: ./.github/workflows/pr-check.yml
    with:
      component: dashboard

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Build and push :main-${short_sha}
        env:
          SHORT_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:7}"
          OWNER="${{ github.repository_owner }}"
          TAG="ghcr.io/${OWNER}/lifelog-dashboard:main-${SHORT_SHA}"
          docker build \
            -t "${TAG}" \
            -f dashboard/Dockerfile \
            ./dashboard
          docker push "${TAG}"
