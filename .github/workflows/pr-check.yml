name: PR Check with actions
on:
  workflow_call:
    inputs:
      component:
        description: 'Component'
        required: false
        default: 'server'
        type: string
jobs:
  echo-server:
    if: inputs.component == 'server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: echo done
  echo-dashboard:
    if: inputs.component == 'dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: echo done
