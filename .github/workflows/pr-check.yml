name: PR Check no if gates
on:
  workflow_call:
    inputs:
      component:
        description: 'Component'
        required: false
        default: 'server'
        type: string
jobs:
  echo-server:
    if: inputs.component == 'server'
    runs-on: ubuntu-latest
    steps:
      - run: echo server
  echo-dashboard:
    if: inputs.component == 'dashboard'
    runs-on: ubuntu-latest
    steps:
      - run: echo dashboard
  echo-firmware:
    if: inputs.component == 'firmware'
    runs-on: ubuntu-latest
    steps:
      - run: echo firmware
  echo-security:
    if: inputs.component == 'security'
    runs-on: ubuntu-latest
    steps:
      - run: echo security
  echo-other:
    if: inputs.component != 'server' && inputs.component != 'dashboard' && inputs.component != 'firmware' && inputs.component != 'security'
    runs-on: ubuntu-latest
    steps:
      - run: echo other ${{ inputs.component }}
