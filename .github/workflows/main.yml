# GitHub Advanced Security: this workflow provides the "security" job that the
# CodeQL configuration references (.github/workflows/main.yml:security).
# All PR component builds run in ci.yml (path-filtered).
# All service publish pipelines run in main-*.yml (on push to main).

name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:main"
