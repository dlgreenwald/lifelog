# Satisfies GitHub Advanced Security's reference to main.yml:security.
# The real analysis is in codeql.yml.  This job uses workflow_run so it
# fires AFTER codeql.yml on the same PR commit, avoiding duplicate runs.
# It uploads with the same category so GitHub deduplicates the results.

name: Main

on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]

permissions:
  security-events: write
  contents: read

jobs:
  security:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:替"
