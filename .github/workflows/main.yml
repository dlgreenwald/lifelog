name: Main Branch

# Fires on push to main (typically after squash-merge of a PR). Runs the
# full suite plus Docker image builds for the three service containers.
#
# Pipeline layout (Actions tab tree view):
#
#   build-and-test    (matrix of 6 reusable invocations)
#     ├── server
#     ├── diarization
#     ├── speaker-id
#     ├── transcription-worker
#     ├── dashboard
#     └── firmware
#   ├── security       (CodeQL py/js + npm audit)
#   └── docker         (needs: build-and-test, security)

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        component: [server, diarization, speaker-id, transcription-worker, dashboard, firmware]
    uses: ./.github/workflows/pr-check.yml
    with:
      component: ${{ matrix.component }}

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'python,javascript'
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: npm audit (dashboard, prod-only, critical)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: dashboard

  docker:
    needs: [build-and-test, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, speaker-id, transcription-worker]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: lifelog/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
