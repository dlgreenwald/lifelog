name: Main Branch

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        component: [server, diarization, speaker-id, transcription-worker, dashboard, firmware]
    uses: ./.github/workflows/pr-check.yml
    with:
      component: ${{ matrix.component }}

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'python,javascript'
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: npm audit (dashboard)
        run: npm audit --audit-level=moderate
        working-directory: dashboard

  docker:
    needs: [build-and-test, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, speaker-id, transcription-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: lifelog/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
