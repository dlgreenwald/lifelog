name: Main Branch

# Diagnostic: drop the `paths` (dorny/paths-filter) job entirely. Each
# downstream job gates directly on `github.event`. If this builds, then the
# 0-jobs failure in the staged full main.yml is specifically caused by the
# `dorny/paths-filter@v3` job loading — not by something downstream of it.

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        component: [server, diarization, speaker-id, transcription-worker, dashboard, firmware]
    uses: ./.github/workflows/pr-check.yml
    with:
      component: ${{ matrix.component }}

  docker:
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [server, speaker-id, transcription-worker, dashboard]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lifelog-${{ matrix.service }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build firmware
        working-directory: firmware-ota
        run: pio run -e xiao_esp32s3

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'python,javascript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
