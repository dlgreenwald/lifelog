name: 'Container Releases'

# Tag-only release workflow. No image rebuilds happen here — `:latest` is
# the source of truth (it was set by each `main-<service>.yml`'s
# `retag-latest` job after the last merge), and `containers-vX.Y.Z` releases
# just retag `:latest` to `:X.Y.Z`.
#
# Trigger: push of a tag matching `containers-v*`. Tag shape:
#   `containers-vX.Y.Z`             → release as `:X.Y.Z` (and `<sha>`)
#   `containers-vX.Y.Z-rcN`         → release as `:X.Y.Z`, `:rc-N`,
#                                    `<sha>` — never touches `:latest`
# `:latest` is never written here. Each `main-<service>.yml`'s
# `retag-latest` job is the only place that touches `:latest`, and it
# only does so after a successful per-component `publish` job on push
# to main.

on:
  push:
    tags:
      - 'containers-v*'

permissions:
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Compute version metadata
        id: version
        run: |
          # Tag is `containers-vX.Y.Z` (with optional `-rcN`).
          raw=${GITHUB_REF_NAME}
          base=${raw#containers-v}
          if [[ "$base" == *"-rc"* ]]; then
            version=${base%%-rc*}
            rcnum=${base##*-rc}
            echo "version=$version"
            echo "rc_tag=rc-$rcnum"
          else
            echo "version=$base"
            echo "rc_tag="
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Pull :latest, retag to :X.Y.Z and :rc-N, push
        env:
          VERSION: '${{ steps.version.outputs.version }}'
          RC_TAG: '${{ steps.version.outputs.rc_tag }}'
          SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          for svc in server speaker-id transcription-worker dashboard; do
            latest=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:latest
            versioned=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:$VERSION
            shatag=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:$SHA
            echo "::group::Tagging $svc at $VERSION (from :latest)"
            if ! docker pull "$latest"; then
              echo "::error::$latest not found; refusing to release a missing image."
              echo "::endgroup::"
              exit 1
            fi
            docker tag "$latest" "$versioned"
            docker tag "$latest" "$shatag"
            docker push "$versioned"
            docker push "$shatag"
            if [[ -n "$RC_TAG" ]]; then
              rctag=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:$RC_TAG
              docker tag "$latest" "$rctag"
              docker push "$rctag"
            fi
            echo "::endgroup::"
          done
