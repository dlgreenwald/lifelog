# Tag-driven docker retag workflow. Source of truth is the per-merge
# `:latest` write performed by each `main-<service>.yml`'s
# `retag-latest` job. This workflow:
#
#   - pulls `:latest` for the four services
#   - retags and pushes `:X.Y.Z`, `<sha>`, and (when applicable) `:rc-N`
#
# Closely paired with `release.yml`: both fire on the same `vX.Y.Z[-rcN]`
# tag push, so a single `v*` cut produces both a coherent container tag
# set AND a firmware-coherent GitHub Release without overlapping shape or
# divergent service lists. The two workflows share a single owner model:
# `release.yml` owns firmware + GitHub Release; this file owns container
# tags.
#
# Trigger: push of a tag matching `vX.Y.Z[-rcN]`. (Historical prefixes
# `containers-v*` and `firmware-v*` are deprecated; only `v*` is honored
# by this workflow going forward.)
#
# Tag shape (parity with release.yml):
#   `vX.Y.Z`               — emit :X.Y.Z and <sha>
#   `vX.Y.Z-rcN`           — emit :X.Y.Z, :rc-N, and <sha>
#
# `:latest` is NEVER written here. Each `main-<service>.yml`'s
# `retag-latest` job is the only place that touches `:latest`, and it
# only does so after a successful per-component `publish` job on push
# to main.

name: 'Container Releases'

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*'

permissions:
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Compute version metadata
        id: version
        run: |
          # Tag is `vX.Y.Z` (with optional `-rcN`). Same parse shape as
          # release.yml so the workflows agree on what -rcN means.
          raw=${GITHUB_REF_NAME}
          base=${raw#v}
          if [[ "$base" == *"-rc"* ]]; then
            version=${base%%-rc*}
            rcnum=${base##*-rc}
            echo "version=$version"
            echo "rc_tag=rc-$rcnum"
          else
            echo "version=$base"
            echo "rc_tag="
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Pull :latest, retag to :X.Y.Z and :rc-N, push
        env:
          VERSION: '${{ steps.version.outputs.version }}'
          RC_TAG: '${{ steps.version.outputs.rc_tag }}'
          SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          for svc in server speaker-id transcription-worker dashboard; do
            latest=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:latest
            versioned=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:$VERSION
            shatag=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:$SHA
            echo "::group::Tagging $svc at $VERSION (from :latest)"
            if ! docker pull "$latest"; then
              echo "::error::$latest not found; refusing to release a missing image."
              echo "::endgroup::"
              exit 1
            fi
            docker tag "$latest" "$versioned"
            docker tag "$latest" "$shatag"
            docker push "$versioned"
            docker push "$shatag"
            if [[ -n "$RC_TAG" ]]; then
              rctag=ghcr.io/${{ github.repository_owner }}/lifelog-$svc:$RC_TAG
              docker tag "$latest" "$rctag"
              docker push "$rctag"
            fi
            echo "::endgroup::"
          done
