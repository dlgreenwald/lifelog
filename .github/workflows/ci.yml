name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Pipeline layout (see Actions tab for the dependency tree):
#
#   detect-changes
#   ├── server             (runs ./server/build.sh)
#   ├── diarization        (runs ./diarization/build.sh)
#   ├── speaker-id         (runs ./speaker-id/build.sh)
#   ├── transcription-worker (runs ./transcription-worker/build.sh)
#   ├── dashboard          (npm ci / tsc / vitest)
#   ├── lifelog-mcp        (runs ./lifelog-mcp/build.sh)
#   ├── firmware           (pio test -e test)
#   └── security           (CodeQL py/js + npm audit prod critical)

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      diarization: ${{ steps.filter.outputs.diarization }}
      speaker-id: ${{ steps.filter.outputs.speaker-id }}
      transcription-worker: ${{ steps.filter.outputs.transcription-worker }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      lifelog-mcp: ${{ steps.filter.outputs.lifelog-mcp }}
      firmware: ${{ steps.filter.outputs.firmware }}
      python-source: ${{ steps.filter.outputs.python-source }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          working-directory: '.'
          filters: |
            server:
              - 'server/**'
            diarization:
              - 'diarization/**'
            speaker-id:
              - 'speaker-id/**'
            transcription-worker:
              - 'transcription-worker/**'
            dashboard:
              - 'dashboard/**'
            lifelog-mcp:
              - 'lifelog-mcp/**'
            firmware:
              - 'firmware-ota/**'
            # Touching CI files (workflows / AGENTS.md / README) re-runs
            # every downstream job — a path-filter or workflow change
            # should be validated everywhere.
            ci-config:
              - '.github/workflows/**'
              - 'AGENTS.md'
              - 'README.md'
            python-source:
              - 'server/**'
              - 'diarization/**'
              - 'speaker-id/**'
              - 'transcription-worker/**'
              - 'dashboard/**'
              - 'lifelog-mcp/**'

  server:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ci-config == 'true' ||
      needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run build
        run: ./build.sh
        working-directory: ./server

  diarization:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ci-config == 'true' ||
      needs.detect-changes.outputs.diarization == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run build
        run: ./build.sh
        working-directory: ./diarization

  speaker-id:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ci-config == 'true' ||
      needs.detect-changes.outputs.speaker-id == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run build
        run: ./build.sh
        working-directory: ./speaker-id

  transcription-worker:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ci-config == 'true' ||
      needs.detect-changes.outputs.transcription-worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run build
        run: ./build.sh
        working-directory: ./transcription-worker

  dashboard:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ci-config == 'true' ||
      needs.detect-changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run test
      - run: npx tsc --noEmit

  lifelog-mcp:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ci-config == 'true' ||
      needs.detect-changes.outputs.lifelog-mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run build
        run: ./build.sh
        working-directory: ./lifelog-mcp

  firmware:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ci-config == 'true' ||
      needs.detect-changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --pre platformio
      - run: ./build.sh
        working-directory: ./firmware-ota

  # CodeQL scanning moved to .github/workflows/codeql.yml so the action
  # database registers a fresh source-of-truth (`codeql.yml:analyze`) and
  # doesn't chase the legacy `main.yml:security` alias. npm audit stays
  # here because it is dashboard-prod-only and orthogonal to CodeQL.

  npm-audit:
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Run npm audit (dashboard prod-only, critical)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: ./dashboard
