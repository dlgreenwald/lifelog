name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Per-component partial-build path filtering — caller-job gates on
# changed_files.* so a PR touching only `server/` runs only that job.
# `security` is inlined here (not in the reusable) because combining
# job-level `permissions:` with `if:` gates inside a `workflow_call`
# reusable triggers parse-time startup_failure on the runner.

jobs:
  server:
    if: contains(github.event.pull_request.changed_files.*, 'server/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: server

  diarization:
    if: contains(github.event.pull_request.changed_files.*, 'diarization/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: diarization

  speaker-id:
    if: contains(github.event.pull_request.changed_files.*, 'speaker-id/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: speaker-id

  transcription-worker:
    if: contains(github.event.pull_request.changed_files.*, 'transcription-worker/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: transcription-worker

  dashboard:
    if: contains(github.event.pull_request.changed_files.*, 'dashboard/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: dashboard

  firmware:
    if: contains(github.event.pull_request.changed_files.*, 'firmware-ota/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: firmware

  security:
    if: |
      contains(github.event.pull_request.changed_files.*, 'server/') ||
      contains(github.event.pull_request.changed_files.*, 'diarization/') ||
      contains(github.event.pull_request.changed_files.*, 'speaker-id/') ||
      contains(github.event.pull_request.changed_files.*, 'transcription-worker/') ||
      contains(github.event.pull_request.changed_files.*, 'dashboard/')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'python,javascript'
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: npm audit (dashboard, prod-only, critical)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: dashboard
