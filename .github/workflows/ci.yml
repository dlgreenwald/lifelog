name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']

jobs:
  server:
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files.*, 'server/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: server

  diarization:
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files.*, 'diarization/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: diarization

  speaker-id:
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files.*, 'speaker-id/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: speaker-id

  transcription-worker:
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files.*, 'transcription-worker/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: transcription-worker

  dashboard:
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files.*, 'dashboard/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: dashboard

  firmware:
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files.*, 'firmware-ota/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: firmware

  security:
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files.*, 'server/') || contains(github.event.pull_request.changed_files.*, 'diarization/') || contains(github.event.pull_request.changed_files.*, 'speaker-id/') || contains(github.event.pull_request.changed_files.*, 'transcription-worker/') || contains(github.event.pull_request.changed_files.*, 'dashboard/')
    uses: ./.github/workflows/pr-check.yml
    with:
      component: security
