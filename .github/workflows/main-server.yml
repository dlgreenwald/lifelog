name: 'Main: Server'

# Per-component merge contract for the server image.
#
# Triggers on push to main when either:
#   - files inside server/** changed (source, deps, Dockerfile, tests, etc.)
#   - the build / runtime infra for this column changed (CI workflows,
#     AGENTS.md, this workflow file, the shared pr-check.yml helper).
#
# The built-in on.push.paths filter schedules this workflow only when at
# least one matching path changed. No third-party path-filter action.
#
# Pipeline (each job's results feed the next via `needs:`):
#
#     test                 (uv venv, ruff, pytest with coverage)
#       └── publish        (docker buildx → ghcr.io :main-${short_sha})
#             └── retag    (pull :main-${short_sha} → tag :latest → push)
#
# Retag lives in this same workflow and waits on publish so that
# `:latest` always points at the image this workflow just built on the
# same push event. Race condition with parallel service workflows is
# a non-issue: each workflow retags using its OWN publish output, so
# even if all four service workflows race the `:latest` push, each
# pushes its own just-published image.

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/**'
      - 'AGENTS.md'

permissions:
  packages: write

jobs:
  test:
    uses: ./.github/workflows/pr-check.yml
    with:
      component: server

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ env.SOURCE_TAG }}
    env:
      SHORT_SHA: '${{ github.sha }}'
      OWNER: '${{ github.repository_owner }}'
      SERVICE: server
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Build and push :main-${short_sha}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:7}"
          SOURCE_TAG="ghcr.io/${OWNER}/lifelog-${SERVICE}:main-${SHORT_SHA}"
          docker build \
            -t "${SOURCE_TAG}" \
            -f "${SERVICE}/Dockerfile" \
            "./${SERVICE}"
          docker push "${SOURCE_TAG}"
          echo "SOURCE_TAG=${SOURCE_TAG}" >> "$GITHUB_ENV"
          echo "image-tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"

  retag-latest:
    needs: publish
    runs-on: ubuntu-latest
    env:
      OWNER: '${{ github.repository_owner }}'
      SERVICE: server
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Retag :main-${short_sha} as :latest
        run: |
          set -euo pipefail
          SOURCE_TAG="${{ needs.publish.outputs.image-tag }}"
          DST="ghcr.io/${OWNER}/lifelog-${SERVICE}:latest"
          echo "Retagging ${SOURCE_TAG} -> ${DST}"
          docker pull "${SOURCE_TAG}"
          docker tag "${SOURCE_TAG}" "${DST}"
          docker push "${DST}"
