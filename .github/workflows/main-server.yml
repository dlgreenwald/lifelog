name: 'Main: Server'

# Per-component merge contract for the server image.
#
# Triggers on push to main when either:
#   - files inside server/** changed (source, deps, Dockerfile, tests, etc.)
#   - the build / runtime infra for this column changed (CI workflows,
#     AGENTS.md, this workflow file, the shared pr-check.yml helper).
#
# The built-in on.push.paths filter is what makes this selective: GitHub
# only schedules this workflow when at least one matching path changed.
# No third-party path-filter action is needed, and no other workflow has
# to gate us with needs/if.
#
# Pipeline layout (Actions tab):
#   test-and-publish
#     1. test      (uv venv + pr-check.yml → ruff, pytest with coverage)
#     2. publish   (docker buildx → ghcr.io :main-${short_sha})

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/**'
      - 'AGENTS.md'

permissions:
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run server tests (uv venv + ruff + pytest)
        uses: ./.github/workflows/pr-check.yml
        with:
          component: server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Build and push as :main-${short_sha}
        env:
          SHORT_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:7}"
          OWNER="${{ github.repository_owner }}"
          TAG="ghcr.io/${OWNER}/lifelog-server:main-${SHORT_SHA}"
          docker build \
            -t "${TAG}" \
            -f server/Dockerfile \
            ./server
          docker push "${TAG}"
