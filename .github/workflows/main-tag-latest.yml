name: 'Main: Tag :latest'

# Sole owner of the `:latest` tag on ghcr.io after a merge.
#
# Triggers on push to main once any of the four image-publishing workflows
# (main-server.yml, main-speaker-id.yml, main-transcription-worker.yml,
# main-dashboard.yml) have run for this commit. Built-in on.push.paths
# matches by inspecting the diff: if a component directory changed under
# server/**, speaker-id/**, transcription-worker/**, or dashboard/**, then
# this workflow fires, looks up the `:main-${short_sha}` image that the
# matching main-*.yml workflow already pushed (within the same push event),
# pulls it, and retags as `:latest`.
#
# No `needs:` chain is required to wire this to the per-component workflows:
# the path filter alone guarantees the tag-latest workflow runs at the right
# moment, and the docker pull step itself is the only "synchronization"
# needed (it will either succeed — the image is there — or it'll warn and
# continue if a service didn't publish this commit).
#
# Pipeline layout (Actions tab):
#   retag-latest (matrix of 4 services)
#     docker pull :main-${short_sha} -> docker tag :latest -> docker push

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'speaker-id/**'
      - 'transcription-worker/**'
      - 'dashboard/**'
      - '.github/workflows/main-*.yml'
      - '.github/workflows/main-tag-latest.yml'

permissions:
  packages: write

jobs:
  retag-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, speaker-id, transcription-worker, dashboard]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Pull :main-${short_sha}, retag, push :latest
        env:
          SHORT_SHA: '${{ github.sha }}'
          SERVICE: '${{ matrix.service }}'
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:7}"
          OWNER="${{ github.repository_owner }}"
          SRC="ghcr.io/${OWNER}/lifelog-${SERVICE}:main-${SHORT_SHA}"
          DST="ghcr.io/${OWNER}/lifelog-${SERVICE}:latest"
          echo "::group::Retagging ${SRC} -> ${DST}"
          if ! docker pull "${SRC}"; then
            echo "::warning::Source image ${SRC} not found; skipping retag for ${SERVICE}"
            echo "::endgroup::"
            exit 0
          fi
          docker tag "${SRC}" "${DST}"
          docker push "${DST}"
          echo "::endgroup::"
