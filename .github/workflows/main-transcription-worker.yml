name: 'Main: Transcription Worker'

# Per-component merge contract for the transcription-worker image.
# Triggers on push to main when files inside transcription-worker/** or the
# shared merge-infra change. See main-server.yml for the design.
#
# Pipeline: test → publish → retag-latest.

on:
  push:
    branches:
      - main
    paths:
      - 'transcription-worker/**'
      - '.github/workflows/**'
      - 'AGENTS.md'

permissions:
  packages: write

jobs:
  test:
    uses: ./.github/workflows/pr-check.yml
    with:
      component: transcription-worker

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ env.SOURCE_TAG }}
    env:
      SHORT_SHA: '${{ github.sha }}'
      OWNER: '${{ github.repository_owner }}'
      SERVICE: transcription-worker
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Build and push :main-${short_sha}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:7}"
          SOURCE_TAG="ghcr.io/${OWNER}/lifelog-${SERVICE}:main-${SHORT_SHA}"
          docker build \
            -t "${SOURCE_TAG}" \
            -f "${SERVICE}/Dockerfile" \
            "./${SERVICE}"
          docker push "${SOURCE_TAG}"
          echo "SOURCE_TAG=${SOURCE_TAG}" >> "$GITHUB_ENV"
          echo "image-tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"

  retag-latest:
    needs: publish
    runs-on: ubuntu-latest
    env:
      OWNER: '${{ github.repository_owner }}'
      SERVICE: transcription-worker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Retag :main-${short_sha} as :latest
        run: |
          set -euo pipefail
          SOURCE_TAG="${{ needs.publish.outputs.image-tag }}"
          DST="ghcr.io/${OWNER}/lifelog-${SERVICE}:latest"
          echo "Retagging ${SOURCE_TAG} -> ${DST}"
          docker pull "${SOURCE_TAG}"
          docker tag "${SOURCE_TAG}" "${DST}"
          docker push "${DST}"
