name: 'Main: Transcription Worker'

# Per-component merge contract for the transcription-worker image.
# Triggers on push to main when files inside transcription-worker/** or the
# shared merge-infra change. See main-server.yml for the design.

on:
  push:
    branches:
      - main
    paths:
      - 'transcription-worker/**'
      - '.github/workflows/**'
      - 'AGENTS.md'

permissions:
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run transcription-worker tests (uv venv + ruff + pytest)
        uses: ./.github/workflows/pr-check.yml
        with:
          component: transcription-worker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Build and push as :main-${short_sha}
        env:
          SHORT_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:7}"
          OWNER="${{ github.repository_owner }}"
          TAG="ghcr.io/${OWNER}/lifelog-transcription-worker:main-${SHORT_SHA}"
          docker build \
            -t "${TAG}" \
            -f transcription-worker/Dockerfile \
            ./transcription-worker
          docker push "${TAG}"
