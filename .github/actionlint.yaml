# actionlint 1.7.x's expression grammar does not yet support `=>` lambda
# parameters in `if:` conditions; the partial-build expressions in ci.yml
# use `f => f.startsWith('server/')` which is valid GitHub-Actions syntax
# but unreadable by the bundled parser. Filter the resulting false
# positives. Remove the entry once actionlint gains lambda support.
paths:
  .github/workflows/ci.yml:
    ignore:
      - 'parser did not reach end of input after parsing the expression'
