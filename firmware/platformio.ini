[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; OTA partition scheme with dual firmware slots
board_build.partitions = partitions/partitions_ota.csv

; PSRAM support (XIAO Sense has 8MB PSRAM)
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; Dependencies
lib_deps =
    sh123/esp32_opus@^1.0.3

monitor_speed = 115200
upload_speed = 921600
