server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ${OIDC_CSP_CONNECT_SRC}; media-src 'self' blob:" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Resolve `server` on every request so DNS-IP changes (e.g. a restart of
    # the server container) self-heal within the resolver TTL instead of
    # staying pinned to the IP this nginx cached at worker startup. Docker's
    # embedded DNS listens on 127.0.0.11:53; TTL is set via the
    # `resolver` directive's `valid=` knob (${NGINX_RESOLVER_TTL}).
    location /api/ {
        resolver ${NGINX_RESOLVER_IP} valid=${NGINX_RESOLVER_TTL} ipv6=off;
        set $api_upstream http://server:8443;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
